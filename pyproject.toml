[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-glory-lab"
version = "0.2.0"
description = "Offline Golden Glory Lab production-intent core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ggl-pob-import = "golden_glory_lab.pob_import.cli:main"

[project.gui-scripts]
golden-glory-lab = "golden_glory_lab.desktop.main:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"golden_glory_lab.runtime_data" = ["*.json"]
"golden_glory_lab.desktop.icons" = ["*.png"]
